spring:
  application:
    name: ai-zero-code
  profiles:
    active: local
  session:
    store-type: redis
    timeout: 604800
  datasource:
    url: jdbc:mysql://localhost:3306/ai_zero_code
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 604800
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: org.zjh.aizerocode.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
